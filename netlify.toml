[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[redirects]]
from = "https://antfu.dev/*"
to = "https://antfu.me/:splat"
status = 302
force = true

[[redirects]]
from = "/posts/welcome-to-my-blog"
to = "/posts/speech-signal-processing-resources-2026"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
